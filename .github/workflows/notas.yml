name: Notas financieras (todas las empresas)

# Recalcula cada domingo el examen financiero de todas las cotizadas con el archivo masivo de la SEC
# y guarda data/notas_financieras.csv.gz, que lee el screener de la terminal.
on:
  schedule:
    - cron: "17 5 * * 0"   # domingos 05:17 UTC
  workflow_dispatch: {}     # botón «Run workflow» para lanzarlo a mano

permissions:
  contents: write

jobs:
  notas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Calcular notas
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Terminal personal de analisis contacto@example.com' }}
        run: python scripts/notas_financieras.py
      - name: Guardar resultado
        run: |
          git config user.name "notas-bot"
          git config user.email "notas-bot@users.noreply.github.com"
          git add data/notas_financieras.csv.gz
          git diff --cached --quiet || git commit -m "Notas financieras semanales ($(date -u +%F))"
          git push
