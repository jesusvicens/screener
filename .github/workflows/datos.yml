name: Datos del screener (cada noche)

# Prepara precios (cada día) y fundamentales (cada semana) del screener y los publica en la rama «datos».
# La app los lee al arrancar, así el screener abre al instante aunque Streamlit se haya reiniciado.
on:
  schedule:
    - cron: "23 22 * * 1-5"   # de lunes a viernes, 22:23 UTC (tras el cierre de Wall Street)
  workflow_dispatch:
    inputs:
      forzar:
        description: "Recalcular también los fundamentales"
        type: boolean
        default: false
  push:                         # al cambiar el propio proceso (la primera vez se ejecuta solo)
    branches: [main]
    paths:
      - ".github/workflows/datos.yml"
      - "scripts/datos_screener.py"

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Preparar datos
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Terminal personal de analisis contacto@example.com' }}
        run: python scripts/datos_screener.py --out out ${{ inputs.forzar && '--forzar' || '' }}
      - name: Publicar en la rama «datos» (sin historial, para no engordar el repo)
        run: |
          cd out
          git init -q -b datos
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add .
          git commit -qm "Datos del screener $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
